root = "."
tmp_dir = "tmp"

[build]
  cmd = "make generate && make css && go build -o ./tmp/main ./cmd/faktura/main.go"
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["tmp", "vendor", "bin", "docs"]
  exclude_regex = ["_test.go", "_templ.go"]
  include_ext = ["go", "templ", "css", "html"]
  kill_delay = 500
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
